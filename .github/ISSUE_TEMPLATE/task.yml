name: "🛠️ Task / Sub-task"
description: "Define a specific, technical piece of work required to complete a user story."
title: "[Task Action Item]"
labels: ["task", "technical"]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Tasks represent engineering implementation steps. They should directly support a User Story, but may also be standalone in some cases.
  - type: textarea
    id: execution-steps
    attributes:
      label: "💻 Technical Implementation Steps"
      description: "List the specific engineering steps required to complete this task."
      placeholder: |
        - [ ] Create database migration for the new column
        - [ ] Update API endpoint payload structure
        - [ ] Write unit tests for the controller
    validations:
      required: true
  - type: textarea
    id: testing-notes
    attributes:
      label: "🧪 Verification & Testing"
      description: "How can a peer reviewer or tester verify that this specific task was implemented correctly?"
      placeholder: "Run npm test or verify endpoint responds with 200 OK..."
    validations:
      required: false
